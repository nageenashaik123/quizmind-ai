<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — QuizMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <!-- Step 1: Email entry -->
        <div id="emailView">
          <div class="auth-brand-header">
            <div class="auth-brand-logo" aria-hidden="true">🧠</div>
            <div class="auth-brand-name">QuizMind <span>AI</span></div>
          </div>

          <h1 class="auth-card-title">Forgot Password?</h1>
          <p class="auth-card-subtitle">Enter your email and we'll send you a reset code.</p>

          <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

          <form class="auth-form" id="forgotForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="email">Email address</label>
              <div class="input-with-icon">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input
                  class="form-input"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                  aria-required="true"
                  aria-describedby="emailError"
                />
              </div>
              <span class="form-error" id="emailError" role="alert"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
              Send Reset Code
            </button>
          </form>

          <div class="auth-form-footer">
            Remembered it? <a href="login.html">Back to Login</a>
          </div>
        </div>

        <!-- Step 2: OTP + new password -->
        <div id="resetView" style="display:none;">
          <div class="otp-icon-circle" aria-hidden="true">🔐</div>
          <h1 class="auth-card-title" style="text-align:center;">Enter Reset Code</h1>
          <p class="auth-card-subtitle" style="text-align:center;">
            Check your email and set a new password.
          </p>

          <div id="otpEmailBox" style="text-align:center;font-size:var(--font-size-sm);
            color:var(--color-primary);font-weight:600;margin-bottom:var(--space-4);"></div>

          <div id="resetAlert" class="auth-alert" role="alert" aria-live="polite"></div>

          <form class="auth-form" id="resetForm" novalidate>
            <div class="otp-group" role="group" aria-label="6-digit reset code">
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp1" aria-label="Digit 1" autocomplete="one-time-code" />
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp2" aria-label="Digit 2" />
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp3" aria-label="Digit 3" />
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp4" aria-label="Digit 4" />
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp5" aria-label="Digit 5" />
              <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]"
                maxlength="1" id="otp6" aria-label="Digit 6" />
            </div>

            <div class="form-group">
              <label class="form-label" for="newPassword">New password</label>
              <div class="input-with-icon">
                <span class="input-icon" aria-hidden="true">🔒</span>
                <input class="form-input" type="password" id="newPassword"
                  placeholder="Min 8 characters" autocomplete="new-password"
                  required aria-required="true" aria-describedby="newPasswordError" />
                <button type="button" class="input-toggle" id="toggleNewPassword"
                  aria-label="Toggle new password">👁</button>
              </div>
              <span class="form-error" id="newPasswordError" role="alert"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmNewPassword">Confirm new password</label>
              <div class="input-with-icon">
                <span class="input-icon" aria-hidden="true">🔒</span>
                <input class="form-input" type="password" id="confirmNewPassword"
                  placeholder="Repeat new password" autocomplete="new-password"
                  required aria-required="true" aria-describedby="confirmNewPasswordError" />
                <button type="button" class="input-toggle" id="toggleConfirmNewPassword"
                  aria-label="Toggle confirm password">👁</button>
              </div>
              <span class="form-error" id="confirmNewPasswordError" role="alert"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="resetSubmitBtn">
              Reset Password
            </button>
          </form>

          <div class="otp-resend" aria-live="polite">
            Did not receive it?
            <button type="button" id="resendResetBtn" disabled>Resend Code</button>
            <span id="resendTimer" class="otp-timer"></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
