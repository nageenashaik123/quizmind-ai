<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/client/favicon.svg?v=2" />
  <title>Create Account — QuizMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card-wrapper" style="max-width:460px;">
      <div class="auth-card">

        <!-- Brand header -->
        <div class="auth-brand-header">
          <div class="auth-brand-logo" aria-hidden="true">🧠</div>
          <div class="auth-brand-name">
            QuizMind <span>AI</span>
          </div>
        </div>

        <h1 class="auth-card-title">Create Account</h1>
        <p class="auth-card-subtitle">Join QuizMind AI and start practising</p>

        <!-- Alert -->
        <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

        <form class="auth-form" id="registerForm" novalidate>

          <!-- Full name -->
          <div class="form-group">
            <label class="form-label" for="name">Full name</label>
            <div class="input-with-icon">
              <span class="input-icon" aria-hidden="true">👤</span>
              <input
                class="form-input"
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
                aria-required="true"
                aria-describedby="nameError"
              />
            </div>
            <span class="form-error" id="nameError" role="alert"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="input-with-icon">
              <span class="input-icon" aria-hidden="true">✉</span>
              <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
                aria-required="true"
                aria-describedby="emailError"
              />
            </div>
            <span class="form-error" id="emailError" role="alert"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-with-icon">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="passwordError passwordStrength"
              />
              <button type="button" class="input-toggle" id="togglePassword" aria-label="Toggle password visibility">👁</button>
            </div>
            <!-- Password strength -->
            <div class="password-strength" id="passwordStrength" aria-live="polite">
              <div class="strength-bars">
                <div class="strength-bar" id="bar1"></div>
                <div class="strength-bar" id="bar2"></div>
                <div class="strength-bar" id="bar3"></div>
                <div class="strength-bar" id="bar4"></div>
              </div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>
            <span class="form-error" id="passwordError" role="alert"></span>
          </div>

          <!-- Confirm password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="input-with-icon">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input
                class="form-input"
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="confirmPasswordError"
              />
              <button type="button" class="input-toggle" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">👁</button>
            </div>
            <span class="form-error" id="confirmPasswordError" role="alert"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            Sign Up
          </button>

        </form>

        <div class="auth-form-footer">
          Already have an account? <a href="login.html">Login</a>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
