<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — QuizMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <div id="resetView">
          <div class="auth-brand-header">
            <div class="auth-brand-logo" aria-hidden="true">🧠</div>
            <div class="auth-brand-name">QuizMind <span>AI</span></div>
          </div>

          <h1 class="auth-card-title">Set New Password</h1>
          <p class="auth-card-subtitle">Choose a strong new password for your account.</p>

          <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

          <form class="auth-form" id="resetPasswordForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="password">New password</label>
              <div class="input-with-icon">
                <span class="input-icon" aria-hidden="true">🔒</span>
                <input class="form-input" type="password" id="password"
                  placeholder="Min 8 characters" autocomplete="new-password"
                  required aria-required="true" aria-describedby="passwordError passwordStrength" />
                <button type="button" class="input-toggle" id="togglePassword"
                  aria-label="Toggle password visibility">👁</button>
              </div>
              <div class="password-strength" id="passwordStrength" aria-live="polite">
                <div class="strength-bars">
                  <div class="strength-bar" id="bar1"></div>
                  <div class="strength-bar" id="bar2"></div>
                  <div class="strength-bar" id="bar3"></div>
                  <div class="strength-bar" id="bar4"></div>
                </div>
                <span class="strength-label" id="strengthLabel"></span>
              </div>
              <span class="form-error" id="passwordError" role="alert"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <div class="input-with-icon">
                <span class="input-icon" aria-hidden="true">🔒</span>
                <input class="form-input" type="password" id="confirmPassword"
                  placeholder="Repeat new password" autocomplete="new-password"
                  required aria-required="true" aria-describedby="confirmPasswordError" />
                <button type="button" class="input-toggle" id="toggleConfirmPassword"
                  aria-label="Toggle confirm password visibility">👁</button>
              </div>
              <span class="form-error" id="confirmPasswordError" role="alert"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
              Reset Password
            </button>
          </form>
        </div>

        <div id="successView" style="display:none;">
          <div class="auth-success-state">
            <div class="auth-success-icon" aria-hidden="true">✅</div>
            <h2>Password Reset!</h2>
            <p>Your password has been updated. You can now log in.</p>
            <a href="login.html" class="btn btn-primary btn-full" style="margin-top:var(--space-2);">
              Back to Login
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
