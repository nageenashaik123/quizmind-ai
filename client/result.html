<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Result — QuizMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/result.css" />
</head>
<body>

  <!-- Navbar -->
  <nav style="position:fixed;top:0;left:0;right:0;height:64px;background:#fff;
    border-bottom:1px solid #E2E8F0;box-shadow:0 1px 0 rgba(0,0,0,.04);
    display:flex;align-items:center;z-index:1000;">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;height:100%;">
      <a href="home.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
        <div style="width:32px;height:32px;background:linear-gradient(135deg,#7C3AED,#6C63FF);
             border-radius:8px;display:flex;align-items:center;justify-content:center;
             font-size:1rem;color:#fff;">🧠</div>
        <span style="font-weight:800;font-size:16px;">
          <span style="color:#0F172A;">QuizMind</span><span style="color:#6C63FF;"> AI</span>
        </span>
      </a>
      <div style="display:flex;align-items:center;gap:4px;background:#F0F2FF;border-radius:50px;padding:4px;">
        <a href="home.html"      style="padding:7px 14px;border-radius:50px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;">🏠 Home</a>
        <a href="dashboard.html" style="padding:7px 14px;border-radius:50px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;">📊 Dashboard</a>
        <a href="history.html"   style="padding:7px 14px;border-radius:50px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;">🕘 History</a>
      </div>
    </div>
  </nav>

  <main style="padding-top:64px;min-height:100vh;background:#F7F9FF;">
    <div style="max-width:680px;margin:0 auto;padding:32px 24px 64px;">

      <!-- Loading -->
      <div id="loadingState" style="text-align:center;padding:80px 0;">
        <div class="spinner spinner-lg" style="margin:0 auto;"></div>
        <p style="margin-top:16px;color:#64748B;">Loading results…</p>
      </div>

      <!-- Result card -->
      <div id="resultCard" style="display:none;" class="animate-fade-in">

        <!-- Header -->
        <div class="result-header">
          <div class="result-trophy" id="resultEmoji" aria-hidden="true">🎉</div>
          <h1 class="result-title">Quiz Completed!</h1>
          <p class="result-subtitle" id="resultSubtitle">Great job!</p>
        </div>

        <!-- Score circle -->
        <div class="score-circle-wrap">
          <div class="score-circle" id="scoreCircle">
            <div class="score-main" id="scoreMain">0%</div>
            <div class="score-fraction" id="scoreFraction">0/0</div>
          </div>
        </div>

        <!-- Stats grid -->
        <div class="result-stats-grid">
          <div class="result-stat correct">
            <span class="result-stat-icon" aria-hidden="true">✓</span>
            <span class="result-stat-value" id="statCorrect">0</span>
            <span class="result-stat-label">Correct</span>
          </div>
          <div class="result-stat wrong">
            <span class="result-stat-icon" aria-hidden="true">✕</span>
            <span class="result-stat-value" id="statWrong">0</span>
            <span class="result-stat-label">Incorrect</span>
          </div>
          <div class="result-stat unanswered">
            <span class="result-stat-icon" aria-hidden="true">—</span>
            <span class="result-stat-value" id="statUnanswered">0</span>
            <span class="result-stat-label">Unanswered</span>
          </div>
        </div>

        <!-- Meta info -->
        <div class="result-meta">
          <div class="result-meta-item">
            <span class="result-meta-label">Subject</span>
            <span class="result-meta-value" id="metaSubject">—</span>
          </div>
          <div class="result-meta-item">
            <span class="result-meta-label">Difficulty</span>
            <span class="result-meta-value" id="metaDifficulty">—</span>
          </div>
          <div class="result-meta-item">
            <span class="result-meta-label">Questions</span>
            <span class="result-meta-value" id="metaQuestions">—</span>
          </div>
          <div class="result-meta-item">
            <span class="result-meta-label">Time Taken</span>
            <span class="result-meta-value" id="metaTime">—</span>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="result-actions">
          <a id="reviewBtn" href="#" class="btn-hero-primary" style="flex:1;text-align:center;
            padding:12px;border-radius:12px;">
            📖 Review Answers
          </a>
          <a href="home.html" class="btn-hero-secondary" style="flex:1;text-align:center;
            padding:12px;border-radius:12px;">
            🔄 Try Again
          </a>
          <a href="dashboard.html" class="btn-hero-secondary" style="flex:1;text-align:center;
            padding:12px;border-radius:12px;">
            📊 Dashboard
          </a>
        </div>

      </div><!-- /resultCard -->

    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/result.js"></script>
</body>
</html>
