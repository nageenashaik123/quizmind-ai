<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/client/favicon.svg" />
  <title>Review Answers — QuizMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/result.css" />
</head>
<body>

  <nav style="position:fixed;top:0;left:0;right:0;height:64px;background:#fff;
    border-bottom:1px solid #E2E8F0;box-shadow:0 1px 0 rgba(0,0,0,.04);
    display:flex;align-items:center;z-index:1000;">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;height:100%;">
      <a href="home.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
        <div style="width:32px;height:32px;background:linear-gradient(135deg,#7C3AED,#6C63FF);
             border-radius:8px;display:flex;align-items:center;justify-content:center;
             font-size:1rem;color:#fff;">🧠</div>
        <span style="font-weight:800;font-size:16px;">
          <span style="color:#0F172A;">QuizMind</span><span style="color:#6C63FF;"> AI</span>
        </span>
      </a>
      <div style="display:flex;align-items:center;gap:4px;background:#F0F2FF;border-radius:50px;padding:4px;">
        <a href="home.html"    style="padding:7px 14px;border-radius:50px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;">🏠 Home</a>
        <a href="history.html" style="padding:7px 14px;border-radius:50px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;">🕘 History</a>
      </div>
    </div>
  </nav>

  <main style="padding-top:64px;min-height:100vh;background:#F7F9FF;">
    <div style="max-width:760px;margin:0 auto;padding:32px 24px 64px;">

      <!-- Loading -->
      <div id="loadingState" style="text-align:center;padding:80px 0;">
        <div class="spinner spinner-lg" style="margin:0 auto;"></div>
        <p style="margin-top:16px;color:#64748B;">Loading review…</p>
      </div>

      <!-- Review content -->
      <div id="reviewContent" style="display:none;" class="animate-fade-in">

        <!-- Header -->
        <div style="margin-bottom:24px;">
          <button onclick="history.back()" class="quiz-back" style="margin-bottom:16px;">
            ← Back to Results
          </button>
          <h1 style="font-size:22px;font-weight:800;color:#0F172A;letter-spacing:-.02em;">
            Review Answers
          </h1>
          <p style="font-size:14px;color:#64748B;margin-top:4px;" id="reviewMeta">—</p>
        </div>

        <!-- Summary bar -->
        <div class="review-summary-bar" id="reviewSummaryBar"></div>

        <!-- Questions list -->
        <div id="questionsList"></div>

      </div>

    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/review.js"></script>
</body>
</html>
