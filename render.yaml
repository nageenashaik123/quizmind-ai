services:
  - type: web
    name: quizmind-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: OLLAMA_BASE_URL
        value: ""            # Ollama not available in cloud — leave empty
      - key: OLLAMA_MODEL
        value: phi3:mini
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
